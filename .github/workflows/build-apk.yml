# Builds the release APK on GitHub's servers and publishes it as a GitHub release, so a new
# version can reach the Fire TV without a Windows machine: install the Downloader app on the
# Fire TV and point it at the release's APK link.
#
# Signing. An update installs over the app already on the TV only if both are signed with the
# same key. With these four repository secrets set (Settings > Secrets and variables > Actions),
# the APK is signed with Crimson's own key from secrets/crimson-release.jks, and updates 1.3 in
# place:
#   KEYSTORE_BASE64   the .jks file, base64-encoded (PowerShell:
#                     [Convert]::ToBase64String([IO.File]::ReadAllBytes("secrets\crimson-release.jks")))
#   STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD   from secrets/keystore.properties
# Without them, a CI key is generated once and kept in the Actions cache, so CI builds update
# each other; installing the first one means uninstalling a build signed with the real key.
# The cache is dropped after 7 days without a build, and a new key then means one more
# uninstall. Adding the secrets ends all of that.
name: Build APK

on:
  push:
    branches: [ "claude/peaceful-mendel-k4bklw" ]
    paths-ignore: [ "**.md" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" "platforms;android-35" > /dev/null

      - name: Release key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p secrets
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > secrets/crimson-release.jks
            printf 'storeFile=secrets/crimson-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > secrets/keystore.properties
            echo "SIGNING=release" >> "$GITHUB_ENV"
          else
            echo "SIGNING=ci" >> "$GITHUB_ENV"
          fi

      - name: CI key (cached)
        if: env.SIGNING == 'ci'
        uses: actions/cache@v4
        with:
          path: ci-key
          key: crimson-ci-signing-key-v1

      - name: CI key
        if: env.SIGNING == 'ci'
        run: |
          if [ ! -f ci-key/ci.jks ]; then
            mkdir -p ci-key
            keytool -genkeypair -keystore ci-key/ci.jks -storepass crimsonci -keypass crimsonci \
              -alias crimson -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Crimson CI" -noprompt
          fi
          printf 'storeFile=ci-key/ci.jks\nstorePassword=crimsonci\nkeyAlias=crimson\nkeyPassword=crimsonci\n' \
            > secrets/keystore.properties

      - name: Core tests
        run: ./gradlew :core:test --stacktrace

      - name: Build and verify the release APK
        run: ./gradlew release --stacktrace

      - name: Name the APK
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          cp dist/*.apk "crimson-$version.apk"
          ls -l "crimson-$version.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: crimson-apk
          path: crimson-*.apk

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          if [ "$SIGNING" = "release" ]; then
            signing="Signed with Crimson's release key: installs over 1.3 and keeps your profiles, My List and resume points."
          else
            signing="Signed with a CI key, not Crimson's release key (the repository secrets are not set). The Fire TV will refuse to install it over 1.3: uninstall Crimson first (Settings > Applications > Manage Installed Applications > Crimson > Uninstall). That clears profiles, My List and resume points; re-enter the profile after installing."
          fi
          cat > notes.md <<EOF
          Built by GitHub Actions from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7}. Not yet tested on a Fire TV.

          **Install:** on the Fire TV, open Downloader and enter
          https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/crimson-${VERSION}.apk

          **Signing:** ${signing}

          **What changed:** stalled live streams are reopened within seconds instead of buffering forever; a profile can use an M3U playlist and guide link (EPGenius) for its live channels and guide; HLS vs MPEG-TS explained in Settings > Playback. Details in README.md ("Using EPGenius") and DECISIONS.md (Crimson 1.4).
          EOF
          sed -i 's/^          //' notes.md
          gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$tag" "crimson-$VERSION.apk" --target "$GITHUB_SHA" \
            --title "Crimson $VERSION (test build)" --notes-file notes.md --prerelease
