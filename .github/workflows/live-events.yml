# Finds the live events in EPGenius's guide for the Sports page's Extra tab
# (tools/events/find_events.py) and publishes them as the `events` release's events.json.gz,
# which the app downloads.
#
# Gemini classifies the guide's titles. Repository secrets, either:
#   GEMINI_API_KEY     a Gemini API key (an API key bound to a service account, restricted to the
#                      Gemini API, from the Cloud console's Credentials page)
# or, for Vertex AI with Application Default Credentials:
#   GCP_PROJECT        the Google Cloud project ID
#   GCP_ADC_JSON       the contents of the ADC file Google's setup script writes
#                      (~/.config/gcloud/application_default_credentials.json), or of a service
#                      account key with the Vertex AI User role
#   TEST_PLAYLIST      optional: the M3U playlist link, so only its channels are considered
# Without either, ANTHROPIC_API_KEY (Claude Haiku) is used if set, and keyword rules if not.
# A model that refuses the key (no billing credit, 401/403) falls back to keyword rules at once.
# Only titles not seen before, and only those marked live or naming an event, reach the model.
#
# The schedule runs only from the default branch (GitHub's rule); until this file is there, it
# runs on pushes to the working branch and by hand.
name: Live events

on:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches: [ "claude/peaceful-mendel-k4bklw" ]
    paths: [ "tools/events/**", ".github/workflows/live-events.yml" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-events
  cancel-in-progress: false

env:
  GUIDE: https://github.com/ferteque/Curated-M3U-Repository/raw/refs/heads/main/epg6.xml.gz

jobs:
  events:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/events

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the model SDKs
        run: pip install --quiet google-genai anthropic pydantic

      - name: Application Default Credentials
        env:
          GCP_ADC_JSON: ${{ secrets.GCP_ADC_JSON }}
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
        run: |
          if [ -n "$GCP_ADC_JSON" ] && [ -n "$GCP_PROJECT" ]; then
            printf '%s' "$GCP_ADC_JSON" > "$RUNNER_TEMP/adc.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/adc.json" >> "$GITHUB_ENV"
            echo "GOOGLE_CLOUD_PROJECT=$GCP_PROJECT" >> "$GITHUB_ENV"
            echo "GOOGLE_CLOUD_LOCATION=global" >> "$GITHUB_ENV"
            echo "Gemini via ADC for project set"
          else
            echo "GCP_PROJECT / GCP_ADC_JSON not set: no Gemini"
          fi

      - name: Last run's verdicts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download events -p cache.json.gz -R "$GITHUB_REPOSITORY" || echo "no cache yet"

      - name: Find the events
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PLAYLIST: ${{ secrets.TEST_PLAYLIST }}
        run: |
          args=(); [ -n "$PLAYLIST" ] && args=(--playlist "$PLAYLIST")
          python tools/events/find_events.py --guide "$GUIDE" "${args[@]}" --prefilter --out events.json.gz --cache cache.json.gz

      - name: Remove the credentials file
        if: always()
        run: rm -f "$RUNNER_TEMP/adc.json"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view events -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create events -R "$GITHUB_REPOSITORY" --title "Live events data" --latest=false --prerelease \
              --notes "Live events found in the guide, refreshed every six hours by .github/workflows/live-events.yml. Read by the app's Sports > Extra tab."
          fi
          gh release upload events events.json.gz cache.json.gz --clobber -R "$GITHUB_REPOSITORY"
